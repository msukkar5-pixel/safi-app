name: Build APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bundle Quran text and font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -sfL --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o app/src/main/assets/quran.json \
            && python3 -c "import json;d=json.load(open('app/src/main/assets/quran.json'));print('surahs',len(d['data']['surahs']))" \
            || { echo "Quran download failed, app will download on first use"; rm -f app/src/main/assets/quran.json; }
          curl -sfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf -o app/src/main/assets/fonts/quran.ttf \
            || curl -sfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf -o app/src/main/assets/fonts/quran.ttf \
            || { echo "font download failed"; rm -f app/src/main/assets/fonts/quran.ttf; }
          mkdir -p app/src/main/assets/tafsir
          for t in muyassar jalalayn; do
            curl -sfL --retry 3 https://api.alquran.cloud/v1/quran/ar.$t -o app/src/main/assets/tafsir/$t.json \
              && python3 -c "import json;d=json.load(open('app/src/main/assets/tafsir/$t.json'));print('$t',sum(len(s['ayahs']) for s in d['data']['surahs']))" \
              || { echo "tafsir $t download failed"; rm -f app/src/main/assets/tafsir/$t.json; }
          done
          # البداية والنهاية لابن كثير (OpenITI, Shamela 4445)
          ( git clone -q --depth 1 --filter=blob:none --sparse https://github.com/OpenITI/0775AH /tmp/oi \
            && cd /tmp/oi && git sparse-checkout set data/0774IbnKathir/0774IbnKathir.Bidaya ) \
            && python3 tools/bidaya.py /tmp/oi/data/0774IbnKathir/0774IbnKathir.Bidaya/0774IbnKathir.Bidaya.Shamela0004445-ara1.completed app/src/main/assets/bidaya \
            || echo "bidaya conversion failed"
          # صورة الكعبة لشاشة الافتتاح (Wikimedia Commons, free licence only)
          python3 tools/kaaba.py app/src/main/assets/splash || echo "kaaba image failed"
          mkdir -p app/src/main/assets/hadith
          for b in bukhari muslim; do
            curl -sfL --retry 3 https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-$b.min.json -o app/src/main/assets/hadith/$b.json \
              && python3 -c "import json;d=json.load(open('app/src/main/assets/hadith/$b.json'));m=d['metadata'];print('$b',len(d['hadiths']),list(m.keys()))" \
              || { echo "hadith $b download failed"; rm -f app/src/main/assets/hadith/$b.json; }
          done
          ls -la app/src/main/assets app/src/main/assets/fonts app/src/main/assets/hadith

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            for chunk in 1 2 3; do
              start=$(( (chunk-1)*40 + 1 )); end=$(( chunk*40 ))
              msg=$(grep -E "^e: |error:|What went wrong|Execution failed|> " build.log | sed -n "${start},${end}p" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              [ -n "$msg" ] && echo "::error title=build-$chunk::$msg"
            done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Safi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Safi-APK
          path: Safi.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: صافي 1.0.${{ github.run_number }}
          files: Safi.apk

  uitest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Safi-APK
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          pip install pillow >/dev/null 2>&1 || true
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/uitest.py Safi.apk tools/uiplan.json || true
      - name: Push results to ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r results/* /tmp/r/ 2>/dev/null || echo "no results" > /tmp/r/none.txt
          cd /tmp/r && git init -q && git checkout -q -b ci-results
          git config user.email ci@safi && git config user.name ci
          echo "${{ github.sha }} run ${{ github.run_number }}" > RUN.txt
          git add -A && git commit -qm "results ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git ci-results
