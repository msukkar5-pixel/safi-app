name: Kaaba previews
on: workflow_dispatch
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/kaaba_preview.py previews && cd previews && zip -q ../kaaba-previews.zip *
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kaaba-previews
          name: kaaba-previews
          prerelease: true
          files: kaaba-previews.zip
